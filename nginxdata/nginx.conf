    server {
        # Redirect all HTTP to HTTPS
        listen 80;
        server_name adguard.torrift.com;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        ssl_certificate /etc/letsencrypt/live/torrift.com-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/torrift.com-0001/privkey.pem;
        server_name adguard.torrift.com;
        # Health check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
        location / {
            proxy_pass http://192.168.1.55:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
	    proxy_set_header Authorization $http_authorization;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        location /dns-query {
            proxy_pass http://192.168.1.55:53;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /dns-query-udp {
            proxy_pass http://192.168.1.55:53;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /dns-custom {
            proxy_pass http://192.168.1.55:5443;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
    server {
        listen 80;
        server_name hermes.torrift.com;
        return 301 https://$host$request_uri;
    }
    
    server {
        listen 443 ssl;
        server_name hermes.torrift.com;
        ssl_certificate /etc/letsencrypt/live/torrift.com-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/torrift.com-0001/privkey.pem;
    
        # auth_basic "Hermes";
        # auth_basic_user_file /etc/nginx/htpasswd/hermes;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    
        location / {
            proxy_pass http://hermes:8642;
        }
    }
    server {
        listen 80;
        server_name signal-api.torrift.com;
        return 301 https://$host$request_uri;
    }
    
    server {
        listen 443 ssl;
        server_name signal-api.torrift.com;
        ssl_certificate /etc/letsencrypt/live/torrift.com-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/torrift.com-0001/privkey.pem;
    
        # auth_basic "Signal API";
        # auth_basic_user_file /etc/nginx/htpasswd/signal-api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
    
        location / {
            proxy_pass http://signal-api:8080;
        }
    }
    
