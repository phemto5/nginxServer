user  nginx;
worker_processes  1;

events {
  worker_connections  1024;
}

http {
    include /etc/nginx/conf.d/*.conf;

    server {
        # Redirect all HTTP to HTTPS
        listen 80;
        server_name next.torrift.com;
        return 301 https://$host$request_uri;
    }
    server {
        listen	443 ssl;
        ssl_certificate /etc/letsencrypt/live/torrift.com-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/torrift.com-0001/privkey.pem;
        server_name next.torrift.com;
        client_max_body_size 2048M;
        proxy_busy_buffers_size 512k;
        proxy_buffers 4 512k;
        proxy_buffer_size 256k;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 2048M;

        location / {
            proxy_headers_hash_max_size 512;
            proxy_headers_hash_bucket_size 64;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
    	    proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Front-End-Https on;
            proxy_pass http://192.168.1.55:980;
        }
        location /.well-known/pki-validation {
            root /www;
            autoindex on;
            sendfile on;
        }
        location /.well-known/carddav {
            return 301 $scheme://$host/remote.php/dav;
        }
        location /.well-known/caldav {
            return 301 $scheme://$host/remote.php/dav;
        }
    }
    server {
        # Redirect all HTTP to HTTPS
        listen 80;
        server_name pihole.torrift.com;
        return 301 https://$host$request_uri;
    }
    server {
        listen	443 ssl;
        ssl_certificate /etc/letsencrypt/live/torrift.com-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/torrift.com-0001/privkey.pem;
        server_name pihole.torrift.com;
        client_max_body_size 2048M;
        proxy_busy_buffers_size 512k;
        proxy_buffers 4 512k;
        proxy_buffer_size 256k;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 2048M;

        location / {
            proxy_headers_hash_max_size 512;
            proxy_headers_hash_bucket_size 64;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
    	    proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Front-End-Https on;
            proxy_pass http://192.168.1.21/;
        }
    }
    server {
        listen 80;
        server_name pgadmin.torrift.com;
        return 301 https://$host$request_uri;
        }

    server {
        listen 443 ssl;
        server_name pgadmin.torrift.com;
        ssl_certificate /etc/letsencrypt/live/torrift.com-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/torrift.com-0001/privkey.pem;

        location / {
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
    	    proxy_set_header Authorization $http_authorization;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_redirect off;
            proxy_pass http://192.168.1.55:5050;
        }
    }
    server {
        # Redirect all HTTP to HTTPS
        listen 80;
        server_name ntfy.torrift.com;
        return 301 https://$host$request_uri;
    }
    server {
        listen	443 ssl;
        ssl_certificate /etc/letsencrypt/live/torrift.com-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/torrift.com-0001/privkey.pem;
        server_name ntfy.torrift.com;
        location / {
            proxy_headers_hash_max_size 512;
            proxy_headers_hash_bucket_size 64;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
    	    proxy_set_header Authorization $http_authorization;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            add_header Front-End-Https on;
            proxy_pass http://192.168.1.55:1080;
        }
    }
    server {
        # Redirect all HTTP to HTTPS
        listen 80;
        server_name n8n.torrift.com;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        ssl_certificate /etc/letsencrypt/live/torrift.com-0001/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/torrift.com-0001/privkey.pem;
        server_name n8n.torrift.com;
        # Main n8n reverse proxy block
        location / {
            proxy_pass http://192.168.1.55:5678;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
    	    proxy_set_header Authorization $http_authorization;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 36000s;
            proxy_send_timeout 36000s;
            chunked_transfer_encoding off;
        }
    }
