events {
}
http {
    server {
        # Redirect all HTTP to HTTPS
        listen 80;
        server_name torrift.com www.torrift.com;
        return 301 https://$host$request_uri;
    }
    server {
        listen	443 ssl;
        ssl_certificate /etc/letsencrypt/live/torrift.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/torrift.com/privkey.pem;
        server_name torrift.com www.torrift.com;
	client_max_body_size 2048M;
	proxy_busy_buffers_size 512k;
	proxy_buffers 4 512k;
	proxy_buffer_size 256k;
	proxy_buffering off;
	proxy_request_buffering off;
	proxy_max_temp_file_size 2048M;

        location / {
            proxy_headers_hash_max_size 512;
            proxy_headers_hash_bucket_size 64;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Front-End-Https on;
            proxy_pass http://192.168.1.55:980;
        }
        location /.well-known/pki-validation {
            root /www;
            autoindex on;
            sendfile on;
        }
        location /.well-known/carddav {
            return 301 $scheme://$host/remote.php/dav;
        }
        location /.well-known/caldav {
            return 301 $scheme://$host/remote.php/dav;
        }
    }
    server {
        # Redirect all HTTP to HTTPS
        listen 80;
        server_name ntfy.torrift.com;
        return 301 https://$host$request_uri;
    }
    server {
        listen	443 ssl;
        ssl_certificate /etc/letsencrypt/live/torrift.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/torrift.com/privkey.pem;
        server_name ntfy.torrift.com;
        location / {
            proxy_headers_hash_max_size 512;
            proxy_headers_hash_bucket_size 64;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            add_header Front-End-Https on;
            proxy_pass http://192.168.1.55:1080;
        }
    }
    server {
        # Redirect all HTTP to HTTPS
        listen 80;
        server_name n8n.torrift.com;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        ssl_certificate /etc/letsencrypt/live/torrift.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/torrift.com/privkey.pem;
        server_name n8n.torrift.com;
        # Main n8n reverse proxy block
        location / {
            proxy_pass http://192.168.1.55:5678;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 36000s;
            proxy_send_timeout 36000s;
            chunked_transfer_encoding off;
        }
    }
    server {
        # Redirect all HTTP to HTTPS
        listen 80;
        server_name ai.torrift.com;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        ssl_certificate /etc/letsencrypt/live/torrift.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/torrift.com/privkey.pem;
        server_name ai.torrift.com;
        location / {
            proxy_headers_hash_max_size 512;
            proxy_headers_hash_bucket_size 64;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Front-End-Https on;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_pass http://192.168.1.150;
        }
    }
    server {
        # Redirect all HTTP to HTTPS
        listen 80;
        server_name jellyfin.torrift.com;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        ssl_certificate /etc/letsencrypt/live/torrift.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/torrift.com/privkey.pem;
        server_name jellyfin.torrift.com;
        location / {
            proxy_pass http://192.168.1.150;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 36000s;
            proxy_send_timeout 36000s;
            chunked_transfer_encoding off;
        }
    }
    server {
        # Redirect all HTTP to HTTPS
        listen 80;
        server_name adguard.torrift.com;
        return 301 https://$host$request_uri;
    }
    server {
        listen 443 ssl;
        ssl_certificate /etc/letsencrypt/live/torrift.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/torrift.com/privkey.pem;
        server_name adguard.torrift.com;
        # Health check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }
        location / {
            proxy_pass http://192.168.1.55:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
        location /dns-query {
            proxy_pass http://192.168.1.55:53;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /dns-query-udp {
            proxy_pass http://192.168.1.55:53;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
        location /dns-custom {
            proxy_pass http://192.168.1.55:5443;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
