events {
}
http {
    server {
        # Redirect all HTTP to HTTPS
        listen 80;
        server_name drownedashes.com next.drownedashes.com www.drownedashes.com next.tlnnegm.local www.tlnnegm.local tlnnegm.local;
        return 301 https://$host$request_uri;
    }
    server {
        listen	443 ssl;
        ssl_certificate /etc/nginx/certs/drownedashes_com_chain.crt;
        ssl_certificate_key	/etc/nginx/certs/drownedashes_com.key;
        server_name drownedashes.com next.drownedashes.com www.drownedashes.com next.tlnnegm.local www.tlnnegm.local tlnnegm.local;
	client_max_body_size 2048M;
	proxy_busy_buffers_size 512k;
	proxy_buffers 4 512k;
	proxy_buffer_size 256k;
	proxy_buffering off;
	proxy_request_buffering off;
	proxy_max_temp_file_size 2048M;

        location / {
            proxy_headers_hash_max_size 512;
            proxy_headers_hash_bucket_size 64;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Front-End-Https on;
            proxy_pass http://192.168.1.55:980;
        }
        location /.well-known/pki-validation {
            root /www;
            autoindex on;
            sendfile on;
        }
        location /.well-known/carddav {
            return 301 $scheme://$host/remote.php/dav;
        }

        location /.well-known/caldav {
            return 301 $scheme://$host/remote.php/dav;
        }
    }

    server {
        # Redirect all HTTP to HTTPS
        listen 80;
        server_name ntfy.tlnnegm.local ntfy.drownedashes.com;
        return 301 https://$host$request_uri;
    }
    server {
        listen	443 ssl;
        ssl_certificate /etc/nginx/certs/drownedashes_com_chain.crt;
        ssl_certificate_key	/etc/nginx/certs/drownedashes_com.key;
        server_name ntfy.tlnnegm.local ntfy.drownedashes.com ;

        location / {
            proxy_headers_hash_max_size 512;
            proxy_headers_hash_bucket_size 64;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            add_header Front-End-Https on;
            proxy_pass http://192.168.1.150;
        }
    }
    server {
        # Redirect all HTTP to HTTPS
        listen 80;
        server_name n8n.tlnnegm.local n8n.drownedashes.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl ;
        server_name n8n.tlnnegm.local n8n.drownedashes.com;

        ssl_certificate /etc/nginx/certs/drownedashes_com_chain.crt;
        ssl_certificate_key /etc/nginx/certs/drownedashes_com.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_timeout 5m;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Main n8n reverse proxy block
        location / {
            proxy_pass http://192.168.1.55:5678;

            # WebSocket support (required!)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Client information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Jellyfin recommended settings
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 36000s;
            proxy_send_timeout 36000s;

            # Disable chunking for video streams
            chunked_transfer_encoding off;
        }
    }

    server {
        # Redirect all HTTP to HTTPS
        listen 80;
        server_name ai.tlnnegm.local ai.drownedashes.com ;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl ;
        ssl_certificate /etc/nginx/certs/drownedashes_com_chain.crt;
        ssl_certificate_key	/etc/nginx/certs/drownedashes_com.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_timeout 5m;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;
        server_name ai.tlnnegm.local ai.drownedashes.com ;

        location / {
            proxy_headers_hash_max_size 512;
            proxy_headers_hash_bucket_size 64;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            add_header Front-End-Https on;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            proxy_http_version 1.1;
            proxy_pass http://192.168.1.150;
        }
    }

    server {
        # Redirect all HTTP to HTTPS
        listen 80;
        server_name jellyfin.tlnnegm.local jellyfin.drownedashes.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl ;
        server_name jellyfin.tlnnegm.local jellyfin.drownedashes.com;

        ssl_certificate /etc/nginx/certs/drownedashes_com_chain.crt;
        ssl_certificate_key /etc/nginx/certs/drownedashes_com.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_timeout 5m;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Main Jellyfin reverse proxy block
        location / {
            proxy_pass http://192.168.1.150;

            # WebSocket support (required!)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";

            # Client information
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Jellyfin recommended settings
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 36000s;
            proxy_send_timeout 36000s;

            # Disable chunking for video streams
            chunked_transfer_encoding off;
        }
    }
    server {
        # Redirect all HTTP to HTTPS
        listen 80;
        server_name adguard.tlnnegm.local adguard.drownedashes.com;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl ;
        server_name adguard.tlnnegm.local adguard.drownedashes.com;

        ssl_certificate /etc/nginx/certs/drownedashes_com_chain.crt;
        ssl_certificate_key /etc/nginx/certs/drownedashes_com.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_session_timeout 5m;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # AdGuard Home main path
    location / {
        proxy_pass http://192.168.1.55:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for AdGuard Home
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # WebSocket support (needed for stats)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # DNS passthrough to upstream
    location /dns-query {
        proxy_pass http://192.168.1.55:53;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # DNS passthrough to upstream (UDP)
    location /dns-query-udp {
        proxy_pass http://192.168.1.55:53;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Custom DNS port if needed
    location /dns-custom {
        proxy_pass http://192.168.1.55:5443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    }
}
