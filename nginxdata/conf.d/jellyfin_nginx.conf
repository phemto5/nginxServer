# Jellyfin reverse proxy — include into nginx.conf's http {} block
# Place at: /home/docker/compose/nginxServer/nginxdata/jellyfin.conf
# Then add inside http {}:  include /etc/nginx/jellyfin.conf;

server {
    listen 80;
    server_name jellyfin.torrift.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name jellyfin.torrift.com;

    ssl_certificate     /etc/letsencrypt/live/torrift.com-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/torrift.com-0001/privkey.pem;

    client_max_body_size 2048M;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_max_temp_file_size 0;
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;

    location / {
        proxy_pass http://192.168.1.55:8096;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
    }

    location /.well-known/pki-validation {
        root /www;
        autoindex on;
    }
}
