# Renewal config for torrift.com via Cloudflare DNS-01
authenticator = dns-cloudflare
dns_cloudflare_credentials = C:/Users/nicho/projects/nginxServer/cloudflare.ini
dns_cloudflare_propagation_seconds = 30

email = your-email@example.com
rsa_key_size = 4096
server = https://acme-v02.api.letsencrypt.org/directory
manual_public_ip_logging_ok = True

# Domains
domains = torrift.com,*.torrift.com

